<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Lechuty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth">

  <aside class="panel">
    <header class="brand">
      <img src="../assets/img/logo.png" alt="Lechuty" class="brand__logo">
      <p class="brand__eyebrow">Contabilidad empresarial</p>
      <h1 class="brand__name">Lechuty</h1>
      <p class="brand__sub">Un clásico que siempre sabe mejor</p>
    </header>
    <img src="../assets/img/galleta.png" alt="" class="panel__galleta">
  </aside>

  <main class="pane">
    <section class="form">
      <h2 class="form__titulo">Iniciar sesión</h2>
      <p class="form__guia">Ingresa tus credenciales para continuar</p>
      <div id="alerta" class="alert" role="alert" hidden><span id="alerta-texto"></span></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Tu usuario" required>
        </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="field__wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
              <button type="button" class="field__toggle" data-toggle="password" aria-pressed="false">Mostrar</button>
            </div>
          </div>

        <button type="submit" id="enviar" class="btn btn--block">
          <span class="btn__spinner" aria-hidden="true" hidden></span>
          <span class="btn__text">Entrar al sistema</span>
        </button>
      </form>

      <p class="alt">¿No tienes cuenta? <a href="../registro/registro.html">Regístrate</a></p>
      <p class="nota">Acceso restringido a usuarios autorizados.</p>
    </section>
  </main>

  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
