<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Proyecto de Contabilidad</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">

    <header class="brand">
      <img src="assets/hero.png" alt="Proyecto de Contabilidad" class="brand__logo">
      <h1 class="brand__name">Proyecto de Contabilidad</h1>
      <p class="brand__sub">Contabilidad empresarial</p>
    </header>

    <section class="card">
      <h2 class="card__title">Iniciar sesión</h2>
      <p class="card__hint">Ingresa tus credenciales para continuar</p>

      <div id="error" class="alert" role="alert" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span id="error-text"></span>
      </div>

      <!-- El envío lo procesa PHP. Cambia "login.php" por la ruta real de tu script. -->
      <form id="login-form" method="post" action="login.php">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="tu.usuario" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="field__wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" id="toggle-password" class="field__toggle" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit" class="btn">
          <span class="btn__spinner" aria-hidden="true" hidden></span>
          <span id="submit-text">Entrar al sistema</span>
        </button>
      </form>

      <p class="alt">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>

    <p class="note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Acceso restringido a usuarios autorizados.
    </p>

  </main>

  <script src="login.js"></script>
</body>
</html>
